<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демо #2: Театральные кулисы с раскрывающимся сюжетом</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #D4AF37, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            text-align: center;
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 4rem;
        }

        /* Театральная сцена */
        .theater-stage {
            position: relative;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* Кулисы */
        .curtain {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 50%, #1a1a1a 100%);
            border: 2px solid #D4AF37;
            transform-origin: top center;
            transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 10;
        }

        .curtain-left {
            left: 0;
            transform: rotateY(-15deg) translateX(-20px);
            border-right: 1px solid #D4AF37;
        }

        .curtain-right {
            right: 0;
            transform: rotateY(15deg) translateX(20px);
            border-left: 1px solid #D4AF37;
        }

        /* Содержимое сцены */
        .stage-content {
            position: relative;
            z-index: 5;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s ease-out 0.5s;
        }

        /* Активация при hover */
        .theater-stage:hover .curtain-left {
            transform: rotateY(-90deg) translateX(-100%);
        }

        .theater-stage:hover .curtain-right {
            transform: rotateY(90deg) translateX(100%);
        }

        .theater-stage:hover .stage-content {
            opacity: 1;
            transform: translateY(0);
        }

        /* Элементы сцены */
        .stage-element {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.2);
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .theater-stage:hover .stage-element {
            transform: translateY(0);
        }

        .stage-element:nth-child(1) {
            transition-delay: 0.8s;
        }

        .stage-element:nth-child(2) {
            transition-delay: 1s;
        }

        /* Видео элемент */
        .video-element {
            aspect-ratio: 9/16;
            max-width: 400px;
            margin: 0 auto;
        }

        .video-element video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Изображение элемент */
        .image-element {
            aspect-ratio: 4/5;
            max-width: 400px;
            margin: 0 auto;
        }

        .image-element img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Текстовые блоки */
        .story-text {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 1rem 2rem;
            border-radius: 10px;
            border: 1px solid #D4AF37;
            opacity: 0;
            transition: all 0.5s ease-out;
        }

        .theater-stage:hover .story-text {
            opacity: 1;
            bottom: -80px;
        }

        .story-text h3 {
            color: #D4AF37;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .story-text p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Театральные огни */
        .spotlight {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            transition: all 0.5s ease-out;
        }

        .theater-stage:hover .spotlight {
            opacity: 1;
            animation: spotlight-pulse 2s ease-in-out infinite;
        }

        @keyframes spotlight-pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .stage-content {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            
            .curtain {
                width: 100%;
                height: 50%;
            }
            
            .curtain-left {
                top: 0;
                left: 0;
                transform: rotateX(-15deg) translateY(-20px);
            }
            
            .curtain-right {
                top: 50%;
                right: 0;
                transform: rotateX(15deg) translateY(20px);
            }
            
            .theater-stage:hover .curtain-left {
                transform: rotateX(-90deg) translateY(-100%);
            }
            
            .theater-stage:hover .curtain-right {
                transform: rotateX(90deg) translateY(100%);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="section-title">Атмосфера кафе</h1>
        <p class="section-subtitle">Почувствуйте уникальную атмосферу "Нервной Лолы"</p>
        
        <div class="theater-stage">
            <div class="spotlight"></div>
            
            <!-- Кулисы -->
            <div class="curtain curtain-left"></div>
            <div class="curtain curtain-right"></div>
            
            <!-- Содержимое сцены -->
            <div class="stage-content">
                <!-- Видео элемент -->
                <div class="stage-element video-element">
                    <video 
                        controls 
                        muted
                        preload="metadata"
                        poster="assets/images/video-poster.jpg">
                        <source src="../WhatsApp_Video_2024-12-13_at_03.34.20.mp4" type="video/mp4">
                    </video>
                    <div class="story-text">
                        <h3>Живая атмосфера</h3>
                        <p>Каждый момент в нашем кафе наполнен теплом и уютом</p>
                    </div>
                </div>
                
                <!-- Изображение элемент -->
                <div class="stage-element image-element">
                    <img 
                        src="../9e32ed17-d72a-4124-8025-852e4cfd45cb.png" 
                        alt="Уникальная атмосфера кафе Нервная Лола">
                    <div class="story-text">
                        <h3>Творческое пространство</h3>
                        <p>Место, где рождаются идеи и вдохновение</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
