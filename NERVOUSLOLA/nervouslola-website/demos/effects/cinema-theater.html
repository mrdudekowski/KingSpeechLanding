<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демо #7: Кинотеатр с проектором и экраном</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #D4AF37, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            text-align: center;
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 4rem;
        }

        /* Кинотеатр */
        .cinema-theater {
            position: relative;
            min-height: 80vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            background: 
                radial-gradient(ellipse at top, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(0, 0, 0, 0.8) 0%, transparent 50%);
        }

        /* Проектор */
        .projector {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .projector-body {
            width: 200px;
            height: 120px;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border-radius: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #D4AF37;
        }

        .projector-lens {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #D4AF37 0%, #1a1a1a 70%);
            border-radius: 50%;
            border: 3px solid #D4AF37;
        }

        /* Луч проектора */
        .projector-beam {
            position: absolute;
            top: 50%;
            right: -200px;
            width: 300px;
            height: 4px;
            background: linear-gradient(90deg, 
                rgba(212, 175, 55, 0.8) 0%, 
                rgba(212, 175, 55, 0.4) 50%, 
                transparent 100%);
            transform: translateY(-50%);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 5;
        }

        .projector:hover .projector-beam {
            opacity: 1;
            animation: beam-flicker 2s ease-in-out infinite;
        }

        @keyframes beam-flicker {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.4; }
        }

        /* Пылинки в луче */
        .dust-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .dust-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            opacity: 0;
            animation: dust-float 3s ease-in-out infinite;
        }

        .dust-particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .dust-particle:nth-child(2) { left: 30%; animation-delay: 0.5s; }
        .dust-particle:nth-child(3) { left: 50%; animation-delay: 1s; }
        .dust-particle:nth-child(4) { left: 70%; animation-delay: 1.5s; }
        .dust-particle:nth-child(5) { left: 90%; animation-delay: 2s; }

        @keyframes dust-float {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0);
            }
            50% {
                opacity: 1;
                transform: translateY(-10px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-20px) scale(0);
            }
        }

        /* Экран */
        .screen {
            position: relative;
            aspect-ratio: 9/16;
            max-width: 400px;
            margin: 0 auto;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 
                0 20px 40px rgba(212, 175, 55, 0.2),
                inset 0 0 0 3px #D4AF37;
        }

        .screen video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Афиша */
        .movie-poster {
            position: relative;
            aspect-ratio: 4/5;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
        }

        .movie-poster:hover {
            transform: scale(1.05);
            box-shadow: 0 30px 60px rgba(212, 175, 55, 0.4);
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Анимированная рамка афиши */
        .poster-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 3px solid #D4AF37;
            border-radius: 20px;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .movie-poster:hover .poster-frame {
            opacity: 1;
            animation: frame-glow 2s ease-in-out infinite;
        }

        @keyframes frame-glow {
            0%, 100% { 
                box-shadow: 0 0 10px #D4AF37;
            }
            50% { 
                box-shadow: 0 0 30px #D4AF37, 0 0 50px rgba(212, 175, 55, 0.5);
            }
        }

        /* Кресла кинотеатра */
        .cinema-seats {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: all 0.5s ease;
        }

        .cinema-theater:hover .cinema-seats {
            opacity: 1;
            bottom: -30px;
        }

        .seat {
            width: 20px;
            height: 20px;
            background: #D4AF37;
            border-radius: 3px;
            opacity: 0.6;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .cinema-theater {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            
            .projector-beam {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="section-title">Атмосфера кафе</h1>
        <p class="section-subtitle">Почувствуйте уникальную атмосферу "Нервной Лолы"</p>
        
        <div class="cinema-theater">
            <!-- Проектор с экраном -->
            <div class="projector">
                <div class="projector-body">
                    <div class="projector-lens"></div>
                </div>
                <div class="projector-beam">
                    <div class="dust-particles">
                        <div class="dust-particle"></div>
                        <div class="dust-particle"></div>
                        <div class="dust-particle"></div>
                        <div class="dust-particle"></div>
                        <div class="dust-particle"></div>
                    </div>
                </div>
                <div class="screen">
                    <video 
                        controls 
                        muted
                        preload="metadata"
                        poster="assets/images/video-poster.jpg">
                        <source src="../WhatsApp_Video_2024-12-13_at_03.34.20.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
            
            <!-- Афиша -->
            <div class="movie-poster">
                <div class="poster-frame"></div>
                <img 
                    src="../9e32ed17-d72a-4124-8025-852e4cfd45cb.png" 
                    alt="Уникальная атмосфера кафе Нервная Лола">
            </div>
            
            <!-- Кресла -->
            <div class="cinema-seats">
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>
                <div class="seat"></div>
            </div>
        </div>
    </div>
</body>
</html>
