<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демо #10: Темная материя с квантовыми эффектами</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #D4AF37, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            text-align: center;
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 4rem;
        }

        /* Квантовое поле */
        .quantum-field {
            position: relative;
            min-height: 80vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            background: 
                radial-gradient(circle at 25% 25%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
        }

        /* Квантовые частицы */
        .quantum-particle {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            opacity: 0.7;
        }

        .quantum-particle:hover {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 30px 60px rgba(212, 175, 55, 0.4);
        }

        /* Видео частица */
        .video-particle {
            aspect-ratio: 9/16;
            max-width: 400px;
            margin: 0 auto;
        }

        .video-particle video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Изображение частица */
        .image-particle {
            aspect-ratio: 4/5;
            max-width: 400px;
            margin: 0 auto;
        }

        .image-particle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Энергетические поля */
        .energy-field {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: all 0.5s ease;
            animation: field-pulse 3s ease-in-out infinite;
        }

        .quantum-particle:hover .energy-field {
            opacity: 1;
            animation: field-pulse 1s ease-in-out infinite;
        }

        @keyframes field-pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                border-color: rgba(212, 175, 55, 0.3);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                border-color: rgba(212, 175, 55, 0.8);
            }
        }

        /* Квантовые вспышки */
        .quantum-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, transparent 70%);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }

        .quantum-particle:hover .quantum-flash {
            opacity: 1;
            animation: quantum-burst 1s ease-out;
        }

        @keyframes quantum-burst {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.5);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* Суперпозиция */
        .superposition {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, 
                transparent 0%, 
                rgba(212, 175, 55, 0.1) 25%, 
                transparent 50%, 
                rgba(255, 215, 0, 0.1) 75%, 
                transparent 100%);
            opacity: 0;
            transition: all 0.5s ease;
            animation: superposition-shift 2s ease-in-out infinite;
        }

        .quantum-particle:hover .superposition {
            opacity: 1;
            animation: superposition-shift 1s ease-in-out infinite;
        }

        @keyframes superposition-shift {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Коллапс волновой функции */
        .wave-collapse {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #D4AF37;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .quantum-particle:hover .wave-collapse {
            opacity: 1;
            animation: collapse-explosion 0.5s ease-out;
        }

        @keyframes collapse-explosion {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(20);
                opacity: 0;
            }
        }

        /* Квантовые туннели */
        .quantum-tunnel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 10px,
                    rgba(212, 175, 55, 0.1) 10px,
                    rgba(212, 175, 55, 0.1) 20px
                );
            opacity: 0;
            transition: all 0.5s ease;
            animation: tunnel-flow 3s linear infinite;
        }

        .quantum-particle:hover .quantum-tunnel {
            opacity: 1;
            animation: tunnel-flow 1s linear infinite;
        }

        @keyframes tunnel-flow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .quantum-field {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="section-title">Атмосфера кафе</h1>
        <p class="section-subtitle">Почувствуйте уникальную атмосферу "Нервной Лолы"</p>
        
        <div class="quantum-field">
            <!-- Видео квантовая частица -->
            <div class="quantum-particle video-particle">
                <div class="energy-field"></div>
                <div class="quantum-flash"></div>
                <div class="superposition"></div>
                <div class="wave-collapse"></div>
                <div class="quantum-tunnel"></div>
                <video 
                    controls 
                    muted
                    preload="metadata"
                    poster="assets/images/video-poster.jpg">
                    <source src="../WhatsApp_Video_2024-12-13_at_03.34.20.mp4" type="video/mp4">
                </video>
            </div>
            
            <!-- Изображение квантовая частица -->
            <div class="quantum-particle image-particle">
                <div class="energy-field"></div>
                <div class="quantum-flash"></div>
                <div class="superposition"></div>
                <div class="wave-collapse"></div>
                <div class="quantum-tunnel"></div>
                <img 
                    src="../9e32ed17-d72a-4124-8025-852e4cfd45cb.png" 
                    alt="Уникальная атмосфера кафе Нервная Лола">
            </div>
        </div>
    </div>
</body>
</html>
