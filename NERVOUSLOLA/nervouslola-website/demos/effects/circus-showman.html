<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демо #4: Цирковой шоумен с акробатическими переходами</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #D4AF37, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            text-align: center;
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 4rem;
        }

        /* Цирковая арена */
        .circus-arena {
            position: relative;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* Акробатические элементы */
        .acrobat {
            position: absolute;
            width: 400px;
            height: 500px;
            transition: all 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .acrobat:nth-child(1) {
            left: 10%;
            top: 20%;
            transform: rotateY(-15deg) rotateX(5deg);
        }

        .acrobat:nth-child(2) {
            right: 10%;
            top: 20%;
            transform: rotateY(15deg) rotateX(-5deg);
        }

        /* Анимации акробатики */
        .acrobat:hover {
            animation: acrobatic-flip 2s ease-in-out;
        }

        .acrobat:nth-child(1):hover {
            animation: acrobatic-flip-left 2s ease-in-out;
        }

        .acrobat:nth-child(2):hover {
            animation: acrobatic-flip-right 2s ease-in-out;
        }

        @keyframes acrobatic-flip-left {
            0% { transform: rotateY(-15deg) rotateX(5deg) translateY(0); }
            25% { transform: rotateY(-45deg) rotateX(45deg) translateY(-50px); }
            50% { transform: rotateY(-90deg) rotateX(90deg) translateY(-100px); }
            75% { transform: rotateY(-135deg) rotateX(45deg) translateY(-50px); }
            100% { transform: rotateY(-15deg) rotateX(5deg) translateY(0); }
        }

        @keyframes acrobatic-flip-right {
            0% { transform: rotateY(15deg) rotateX(-5deg) translateY(0); }
            25% { transform: rotateY(45deg) rotateX(-45deg) translateY(-50px); }
            50% { transform: rotateY(90deg) rotateX(-90deg) translateY(-100px); }
            75% { transform: rotateY(135deg) rotateX(-45deg) translateY(-50px); }
            100% { transform: rotateY(15deg) rotateX(-5deg) translateY(0); }
        }

        /* Содержимое акробата */
        .acrobat-content {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.3);
            position: relative;
        }

        /* Видео акробат */
        .video-acrobat {
            aspect-ratio: 9/16;
        }

        .video-acrobat video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Изображение акробат */
        .image-acrobat {
            aspect-ratio: 4/5;
        }

        .image-acrobat img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Золотые искры */
        .sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #D4AF37;
            border-radius: 50%;
            opacity: 0;
            animation: sparkle-burst 1s ease-out;
        }

        .sparkle:nth-child(1) { top: 20%; left: 20%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 40%; left: 60%; animation-delay: 0.1s; }
        .sparkle:nth-child(3) { top: 60%; left: 30%; animation-delay: 0.2s; }
        .sparkle:nth-child(4) { top: 80%; left: 70%; animation-delay: 0.3s; }
        .sparkle:nth-child(5) { top: 30%; left: 80%; animation-delay: 0.4s; }

        @keyframes sparkle-burst {
            0% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.5) rotate(180deg);
            }
            100% {
                opacity: 0;
                transform: scale(0) rotate(360deg);
            }
        }

        /* Активация искр при hover */
        .acrobat:hover .sparkle {
            animation: sparkle-burst 1s ease-out;
        }

        /* Конфетти */
        .confetti {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #D4AF37;
            opacity: 0;
            animation: confetti-fall 3s ease-in-out infinite;
        }

        .confetti:nth-child(1) { left: 45%; animation-delay: 0s; }
        .confetti:nth-child(2) { left: 50%; animation-delay: 0.2s; }
        .confetti:nth-child(3) { left: 55%; animation-delay: 0.4s; }
        .confetti:nth-child(4) { left: 48%; animation-delay: 0.6s; }
        .confetti:nth-child(5) { left: 52%; animation-delay: 0.8s; }

        @keyframes confetti-fall {
            0% {
                opacity: 0;
                transform: translateY(0) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg);
            }
        }

        /* Активация конфетти при hover */
        .acrobat:hover ~ .confetti {
            animation: confetti-fall 3s ease-in-out;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .acrobat {
                width: 300px;
                height: 400px;
                position: relative;
                left: auto !important;
                right: auto !important;
                top: auto !important;
                margin: 1rem auto;
            }
            
            .circus-arena {
                flex-direction: column;
                gap: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="section-title">Атмосфера кафе</h1>
        <p class="section-subtitle">Почувствуйте уникальную атмосферу "Нервной Лолы"</p>
        
        <div class="circus-arena">
            <!-- Видео акробат -->
            <div class="acrobat">
                <div class="acrobat-content video-acrobat">
                    <div class="sparkles">
                        <div class="sparkle"></div>
                        <div class="sparkle"></div>
                        <div class="sparkle"></div>
                        <div class="sparkle"></div>
                        <div class="sparkle"></div>
                    </div>
                    <video 
                        controls 
                        muted
                        preload="metadata"
                        poster="assets/images/video-poster.jpg">
                        <source src="../WhatsApp_Video_2024-12-13_at_03.34.20.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
            
            <!-- Изображение акробат -->
            <div class="acrobat">
                <div class="acrobat-content image-acrobat">
                    <div class="sparkles">
                        <div class="sparkle"></div>
                        <div class="sparkle"></div>
                        <div class="sparkle"></div>
                        <div class="sparkle"></div>
                        <div class="sparkle"></div>
                    </div>
                    <img 
                        src="../9e32ed17-d72a-4124-8025-852e4cfd45cb.png" 
                        alt="Уникальная атмосфера кафе Нервная Лола">
                </div>
            </div>
            
            <!-- Конфетти -->
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
        </div>
    </div>
</body>
</html>
