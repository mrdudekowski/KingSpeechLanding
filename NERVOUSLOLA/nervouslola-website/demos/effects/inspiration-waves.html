<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демо #8: Волны вдохновения с резонансом</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #D4AF37, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            text-align: center;
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 4rem;
        }

        /* Океан вдохновения */
        .inspiration-ocean {
            position: relative;
            min-height: 80vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            background: 
                radial-gradient(circle at 30% 20%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 50%);
        }

        /* Элементы-источники волн */
        .wave-source {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .wave-source:hover {
            transform: scale(1.05);
            box-shadow: 0 30px 60px rgba(212, 175, 55, 0.4);
        }

        /* Видео источник */
        .video-source {
            aspect-ratio: 9/16;
            max-width: 400px;
            margin: 0 auto;
        }

        .video-source video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Изображение источник */
        .image-source {
            aspect-ratio: 4/5;
            max-width: 400px;
            margin: 0 auto;
        }

        .image-source img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Волны */
        .wave {
            position: absolute;
            border: 2px solid #D4AF37;
            border-radius: 50%;
            opacity: 0;
            animation: wave-expand 3s ease-out infinite;
            pointer-events: none;
        }

        .wave:nth-child(1) {
            animation-delay: 0s;
        }

        .wave:nth-child(2) {
            animation-delay: 0.5s;
        }

        .wave:nth-child(3) {
            animation-delay: 1s;
        }

        .wave:nth-child(4) {
            animation-delay: 1.5s;
        }

        @keyframes wave-expand {
            0% {
                width: 50px;
                height: 50px;
                opacity: 1;
                transform: translate(-50%, -50%);
            }
            100% {
                width: 400px;
                height: 400px;
                opacity: 0;
                transform: translate(-50%, -50%);
            }
        }

        /* Активация волн при hover */
        .wave-source:hover .wave {
            animation-duration: 2s;
            border-color: #FFD700;
        }

        /* Интерференция волн */
        .wave-interference {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            opacity: 0;
            transform: translate(-50%, -50%);
            animation: interference-pulse 4s ease-in-out infinite;
        }

        .wave-source:hover ~ .wave-interference,
        .wave-source:hover + .wave-interference {
            opacity: 1;
            animation: interference-pulse 2s ease-in-out infinite;
        }

        @keyframes interference-pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0.6;
            }
        }

        /* Звуковые волны */
        .sound-wave {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 20px;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .sound-bar {
            position: absolute;
            bottom: 0;
            width: 4px;
            background: #D4AF37;
            border-radius: 2px;
            animation: sound-pulse 1s ease-in-out infinite;
        }

        .sound-bar:nth-child(1) { left: 0; animation-delay: 0s; }
        .sound-bar:nth-child(2) { left: 8px; animation-delay: 0.1s; }
        .sound-bar:nth-child(3) { left: 16px; animation-delay: 0.2s; }
        .sound-bar:nth-child(4) { left: 24px; animation-delay: 0.3s; }
        .sound-bar:nth-child(5) { left: 32px; animation-delay: 0.4s; }
        .sound-bar:nth-child(6) { left: 40px; animation-delay: 0.5s; }
        .sound-bar:nth-child(7) { left: 48px; animation-delay: 0.6s; }
        .sound-bar:nth-child(8) { left: 56px; animation-delay: 0.7s; }
        .sound-bar:nth-child(9) { left: 64px; animation-delay: 0.8s; }
        .sound-bar:nth-child(10) { left: 72px; animation-delay: 0.9s; }

        @keyframes sound-pulse {
            0%, 100% { height: 4px; }
            50% { height: 20px; }
        }

        .wave-source:hover .sound-wave {
            opacity: 1;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .inspiration-ocean {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="section-title">Атмосфера кафе</h1>
        <p class="section-subtitle">Почувствуйте уникальную атмосферу "Нервной Лолы"</p>
        
        <div class="inspiration-ocean">
            <!-- Видео источник волн -->
            <div class="wave-source video-source">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <video 
                    controls 
                    muted
                    preload="metadata"
                    poster="assets/images/video-poster.jpg">
                    <source src="../WhatsApp_Video_2024-12-13_at_03.34.20.mp4" type="video/mp4">
                </video>
                <div class="sound-wave">
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                </div>
            </div>
            
            <!-- Изображение источник волн -->
            <div class="wave-source image-source">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <img 
                    src="../9e32ed17-d72a-4124-8025-852e4cfd45cb.png" 
                    alt="Уникальная атмосфера кафе Нервная Лола">
                <div class="sound-wave">
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                    <div class="sound-bar"></div>
                </div>
            </div>
            
            <!-- Интерференция волн -->
            <div class="wave-interference"></div>
        </div>
    </div>
</body>
</html>
